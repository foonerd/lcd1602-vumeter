# The release on a tag vX.Y.Z: the check, the binaries for every
# architecture, the plugin zip and its digest, published as a GitHub
# release.
name: release

on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchains
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu libc6-dev-armhf-cross libc6-dev-arm64-cross \
            libasound2-dev shellcheck
          rustup toolchain install && rustup show active-toolchain
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-bin: false
          save-if: false
      - name: Check, ship, package
        run: |
          scripts/check.sh
          scripts/ship.sh
          scripts/package.sh
          ( cd dist && sha256sum ./*.zip > SHA256SUMS )
      # The notes: the version's changelog section, then the sponsorship footer.
      - name: Release notes
        run: |
          scripts/release-notes.sh "${GITHUB_REF_NAME#v}" > dist/notes.md
          printf '\n' >> dist/notes.md
          cat .github/release-footer.md >> dist/notes.md
      # Published as a pre-release until it has been tried on a player; made
      # the latest by hand (gh release edit <tag> --prerelease=false --latest).
      - name: Release
        uses: softprops/action-gh-release@v3
        with:
          prerelease: true
          body_path: dist/notes.md
          files: |
            dist/*.zip
            dist/SHA256SUMS
