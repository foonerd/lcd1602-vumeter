# The check on every push and pull request, and the shipped binaries for
# every architecture as a build artefact.
name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Toolchains
        run: |
          sudo apt-get update
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            gcc-arm-linux-gnueabihf gcc-aarch64-linux-gnu libc6-dev-armhf-cross libc6-dev-arm64-cross \
            libasound2-dev shellcheck
          rustup toolchain install && rustup show active-toolchain
      - uses: actions/setup-node@v7
        with:
          node-version: 20
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ci
          cache-bin: false
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Check
        run: scripts/check.sh
      - name: Ship
        run: scripts/ship.sh
      - name: Package
        run: scripts/package.sh
      - uses: actions/upload-artifact@v7
        with:
          name: plugin
          path: dist/*.zip
